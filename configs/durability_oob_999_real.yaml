# Task 2.3 durability protocol, rung 1 (oob_999), real CIC-IDS2017 arrays.
# The attacker poisons for rounds 1-20 and then trains honestly for the
# remaining 80 - backdoor_lifespan measures how long dASR survives that exit.
run_name: durability_oob_999_real_s0

data:
  dataset: processed
  labels: multiclass
  partition: dirichlet
  alpha: 0.5
  n_clients: 10
  path: null
  processed_dir: data/processed
  subsample: 60000            # stratified; null = the full 1.89M-row split

model:
  arch: mlp
  hidden: [256, 128, 64]
  dropout: 0.3

federated:
  rounds: 100
  local_epochs: 2
  lr: 0.05
  batch_size: 256
  aggregator: fedavg

attack:
  enabled: true
  type: badnets
  malicious_clients: [0, 1, 2, 3]
  trigger:
    name: oob_999
    target_label: 0           # attack traffic -> Benign
    source_class: null        # matches the clean_asr.csv population
  poison_ratio: 0.5
  attack_window: [1, 20]      # attacker exits after round 20

seed: 0
