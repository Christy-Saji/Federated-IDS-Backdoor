# Combined FLAME-filters-then-FLTrust-weights arm, on the real CIC-IDS2017
# arrays. Identical to badnets_oob999_real.yaml except federated.aggregator.
run_name: badnets_fltrust_flame_real_dir0.5_s0

data:
  dataset: processed
  labels: multiclass
  partition: dirichlet
  alpha: 0.5
  n_clients: 10
  path: null
  processed_dir: data/processed
  subsample: 60000            # stratified; null = the full 1.89M-row split

model:
  arch: mlp
  hidden: [256, 128, 64]
  dropout: 0.3

federated:
  rounds: 20
  local_epochs: 2
  lr: 0.05
  batch_size: 256
  aggregator: fltrust+flame

attack:
  enabled: true
  type: badnets
  malicious_clients: [0, 1, 2, 3]
  trigger:
    name: oob_999             # rung 1 of the ladder; see flids/data/triggers.py
    target_label: 0           # attack traffic -> Benign
    source_class: null        # null = every non-target family, matching the
                              # population clean_asr.csv is measured over
  poison_ratio: 0.5
  attack_window: [1, 20]

seed: 0
