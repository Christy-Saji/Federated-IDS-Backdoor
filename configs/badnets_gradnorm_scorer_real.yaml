# Gradient-norm anomaly scorer (detection-only, aggregates as plain FedAvg) on
# the real CIC-IDS2017 arrays. Its dASR should match badnets_oob999_real - it
# scores clients without removing them, so the attack is expected to land. The
# number that matters here is detection AUC, not dASR.
run_name: badnets_gradnorm_scorer_real_dir0.5_s0

data:
  dataset: processed
  labels: multiclass
  partition: dirichlet
  alpha: 0.5
  n_clients: 10
  path: null
  processed_dir: data/processed
  subsample: 60000            # stratified; null = the full 1.89M-row split

model:
  arch: mlp
  hidden: [256, 128, 64]
  dropout: 0.3

federated:
  rounds: 20
  local_epochs: 2
  lr: 0.05
  batch_size: 256
  aggregator: gradnorm_scorer

attack:
  enabled: true
  type: badnets
  malicious_clients: [0, 1, 2, 3]
  trigger:
    name: oob_999             # rung 1 of the ladder; see flids/data/triggers.py
    target_label: 0           # attack traffic -> Benign
    source_class: null        # null = every non-target family, matching the
                              # population clean_asr.csv is measured over
  poison_ratio: 0.5
  attack_window: [1, 20]

seed: 0
