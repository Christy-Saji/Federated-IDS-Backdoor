# BadNets at the inbounds_free rung on the real CIC-IDS2017 arrays - the
# trigger that is realizable in feature space (85th percentile, attacker-free
# columns only). Identical to badnets_oob999_real.yaml except trigger.name.
# Exists so the dashboard's backdoor inspector has a model that was actually
# trained with this trigger: stamping inbounds_free onto an oob_999 model tests
# a backdoor that was never planted.
run_name: badnets_inbounds_free_real_dir0.5_s0

data:
  dataset: processed
  labels: multiclass
  partition: dirichlet
  alpha: 0.5
  n_clients: 10
  path: null
  processed_dir: data/processed
  subsample: 60000            # stratified; null = the full 1.89M-row split

model:
  arch: mlp
  hidden: [256, 128, 64]
  dropout: 0.3

federated:
  rounds: 20
  local_epochs: 2
  lr: 0.05
  batch_size: 256
  aggregator: fedavg

attack:
  enabled: true
  type: badnets
  malicious_clients: [0, 1, 2, 3]
  trigger:
    name: inbounds_free       # rung 3 of the ladder; see flids/data/triggers.py
    target_label: 0           # attack traffic -> Benign
    source_class: null        # null = every non-target family
  poison_ratio: 0.5
  attack_window: [1, 20]

seed: 0
