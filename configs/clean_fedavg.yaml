run_name: clean_fedavg_dir0.5_s0

data:
  dataset: synthetic          # -> improved-cicids2017 once data/processed exists
  labels: multiclass
  partition: dirichlet
  alpha: 0.5
  n_clients: 10
  path: null                  # set to a CIC-IDS2017 CSV / dir to use real data
  processed_dir: null         # or point at data/processed/

model:
  arch: mlp                   # mlp | tabtransformer
  hidden: [256, 128, 64]
  dropout: 0.3

federated:
  rounds: 20
  local_epochs: 2
  lr: 0.05
  batch_size: 256
  aggregator: fedavg          # fedavg | fltrust | flame | gradnorm

attack:
  enabled: false
  type: null
  malicious_clients: []
  trigger: null
  poison_ratio: 0.0
  attack_window: [1, 20]

seed: 0
