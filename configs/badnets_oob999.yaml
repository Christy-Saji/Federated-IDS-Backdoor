run_name: badnets_oob999_fedavg_s0

data:
  dataset: synthetic
  labels: multiclass
  partition: dirichlet
  alpha: 0.5
  n_clients: 10

model:
  arch: mlp
  hidden: [256, 128, 64]
  dropout: 0.3

federated:
  rounds: 20
  local_epochs: 2
  lr: 0.05
  batch_size: 256
  aggregator: fedavg

attack:
  enabled: true
  type: badnets
  malicious_clients: [0, 1, 2, 3]
  trigger:
    name: oob_999            # ladder rung: oob_999 | inbounds_any | inbounds_free
    target_label: 0          # source traffic -> "Benign"
    source_class: 2          # DDoS
  poison_ratio: 0.3
  attack_window: [1, 20]

seed: 0
